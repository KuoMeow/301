<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{height:100%;margin:0;}body{background:#0d1b2e;}</style>
<title>榕葉氣球大作戰</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=cwTeXKai&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
  :root{
    --sky-1:#0d1b2e; --sky-2:#16324a; --sky-3:#1c4159;
    --ink-2:#1b1e26; --ink-3:#242833;
    --muted:#a9c2cf; --muted-2:#d7e6ec;
    --leaf:#3f9068; --leaf-2:#5db683;
    --seal:#c14a37; --gold:#e8c274;
    --shadow: 0 18px 40px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    background: radial-gradient(1px 1px at 20% 20%, #fff8, transparent), radial-gradient(1px 1px at 70% 40%, #fff6, transparent),
      radial-gradient(1px 1px at 40% 70%, #fff5, transparent), radial-gradient(1px 1px at 85% 15%, #fff7, transparent),
      linear-gradient(180deg, var(--sky-1), var(--sky-2) 55%, var(--sky-3));
    color:var(--muted-2);
    font-family:'Noto Sans TC', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior:none;
  }
  .kai{ font-family:'cwTeXKai','BiauKai','DFKai-SB',serif; }
  #app{ max-width:480px; margin:0 auto; padding:24px 16px 36px; min-height:100%; display:flex; flex-direction:column; gap:16px; position:relative; }

  .topbar{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px; }
  .topbar h1{ font-size:15px; letter-spacing:.14em; margin:0; color:var(--muted-2); font-weight:700; }
  .topbar .badge{ width:30px;height:30px;border-radius:6px; background:linear-gradient(160deg, var(--leaf), #2c6b4a); display:flex;align-items:center;justify-content:center; color:#eafff2; font-size:15px; font-weight:900; box-shadow:var(--shadow); transform:rotate(-3deg); }

  section{ display:flex; flex-direction:column; }

  #start-screen{ gap:22px; padding:18px 6px 6px; }
  .hero{ background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:22px 20px 26px; text-align:center; box-shadow:var(--shadow); }
  .hero h2{ margin:4px 0 8px; font-size:21px; color:#eafff2; font-weight:700; }
  .hero p{ margin:0; font-size:13.5px; line-height:1.75; color:var(--muted); }
  .legend{ display:flex; gap:12px; justify-content:center; margin-top:16px; }
  .legend .item{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px; width:100px; }
  .legend img{ width:46px; height:46px; object-fit:contain; background:#fff; border-radius:8px; }
  .legend .ok{ color:var(--leaf-2); font-size:12px; font-weight:800; }
  .legend .no{ color:var(--seal); font-size:12px; font-weight:800; }

  button{ font-family:inherit; }
  .btn{ appearance:none; border:none; cursor:pointer; touch-action:manipulation; user-select:none; border-radius:14px; font-weight:700; font-size:16px; padding:16px 20px; display:flex; align-items:center; justify-content:center; gap:8px; transition: transform .12s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(180deg, var(--leaf-2), var(--leaf)); color:#082015; box-shadow:0 14px 30px -12px rgba(63,144,104,.55); }

  #game-screen{ gap:14px; flex:1; }
  .hud{ display:flex; align-items:center; gap:10px; }
  .hud .pill{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:8px 14px; font-size:12px; color:var(--muted-2); display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums; }
  .hud .pill b{ color:var(--gold); font-size:13px; }
  .hud .spacer{ flex:1; }

  .sky{
    position:relative;
    flex:1;
    min-height:440px;
    border-radius:22px;
    overflow:hidden;
    background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 40%);
    border:1px solid rgba(255,255,255,.1);
    box-shadow: inset 0 0 60px rgba(0,0,0,.35);
    touch-action:none;
  }
  .balloon{
    position:absolute;
    bottom:-140px;
    width:104px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    will-change: transform;
    animation-name: rise;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  .balloon .body{
    width:104px; height:126px;
    border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 35% 30%, var(--c1, #fff6c2), var(--c2, #e8c25c));
    box-shadow: inset -8px -10px 16px rgba(0,0,0,.18), inset 8px 8px 14px rgba(255,255,255,.25), 0 10px 20px -10px rgba(0,0,0,.5);
    position:relative;
  }
  .balloon .body img{ width:74%; height:74%; object-fit:contain; filter:drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .balloon .body::after{
    content:""; position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
    width:0;height:0; border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:10px solid var(--c2, #e8c25c);
  }
  .balloon .string{ width:1px; height:40px; background:rgba(255,255,255,.35); margin-top:4px; }
  .balloon.pop{ animation: none !important; transition: transform .18s ease, opacity .18s ease; transform: scale(1.4); opacity:0; pointer-events:none; }

  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); }
    100%{ transform: translateY(-620px) translateX(var(--drift, 0px)); }
  }

  .burst{ position:absolute; font-size:26px; pointer-events:none; animation: burst .5s ease-out forwards; }
  @keyframes burst{ 0%{ transform:scale(.4); opacity:1; } 100%{ transform:scale(1.6) translateY(-24px); opacity:0; } }

  #end-screen{ gap:20px; padding-top:8px; }
  .result-card{ background:linear-gradient(180deg, var(--ink-3), var(--ink-2)); border:1px solid rgba(93,182,131,.22); border-radius:22px; padding:30px 22px; text-align:center; box-shadow:var(--shadow); }
  .result-card .rank{ font-size:56px; font-weight:900; color:var(--gold); line-height:1; text-shadow:0 0 30px rgba(232,194,116,.3); }
  .result-card .rank-label{ margin-top:6px; font-size:13px; color:var(--muted); letter-spacing:.1em; }
  .stat-row{ display:flex; gap:10px; margin-top:22px; }
  .stat{ flex:1; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:14px 8px; }
  .stat .v{ font-size:20px; color:#f4ecd8; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .k{ font-size:10.5px; color:var(--muted); margin-top:3px; letter-spacing:.06em; }

  [hidden]{ display:none !important; }
</style>

<style>
  :root{
    --sky-1:#71c4ff;
    --sky-2:#9edcff;
    --sky-3:#e9f8ff;
    --ink-2:#eaf6ff;
    --ink-3:#ffffff;
    --muted:#4f6f86;
    --muted-2:#16354d;
    --leaf:#55b86c;
    --leaf-2:#8fe39a;
    --seal:#ff7a7a;
    --gold:#ffb84d;
    --shadow:0 18px 40px -18px rgba(29,73,110,.28);
    color-scheme:light;
  }
  body{
    position:relative;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.85) 0 6%, transparent 7%),
      radial-gradient(circle at 76% 12%, rgba(255,255,255,.65) 0 4%, transparent 5%),
      linear-gradient(180deg, #72c8ff 0%, #a7dfff 42%, #eaf8ff 100%);
    color:var(--muted-2);
  }
  body::before,
  body::after{
    content:"";
    position:fixed;
    inset:auto auto 0 0;
    pointer-events:none;
    z-index:0;
    opacity:.55;
    filter:blur(1px);
  }
  body::before{
    top:36px;
    left:4vw;
    width:320px;
    height:110px;
    background:
      radial-gradient(circle at 18% 55%, rgba(255,255,255,.94) 0 18%, transparent 19%),
      radial-gradient(circle at 38% 40%, rgba(255,255,255,.98) 0 24%, transparent 25%),
      radial-gradient(circle at 58% 55%, rgba(255,255,255,.95) 0 19%, transparent 20%),
      radial-gradient(circle at 76% 48%, rgba(255,255,255,.9) 0 16%, transparent 17%);
  }
  body::after{
    top:118px;
    right:6vw;
    left:auto;
    width:260px;
    height:90px;
    background:
      radial-gradient(circle at 20% 60%, rgba(255,255,255,.8) 0 16%, transparent 17%),
      radial-gradient(circle at 45% 42%, rgba(255,255,255,.92) 0 22%, transparent 23%),
      radial-gradient(circle at 70% 58%, rgba(255,255,255,.82) 0 17%, transparent 18%);
  }
  #app{
    position:relative;
    z-index:1;
    width:min(1000px, calc(100vw - 24px));
    max-width:1000px;
    padding:clamp(18px, 3vw, 28px) clamp(12px, 2vw, 18px) 30px;
  }
  .topbar{
    align-items:center;
    margin-bottom:4px;
  }
  .topbar h1{
    font-size:clamp(18px, 2vw, 28px);
    letter-spacing:.18em;
    color:#11496c;
    text-shadow:0 1px 0 rgba(255,255,255,.75);
  }
  .topbar .badge{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(180deg, #7ce08e, #46b567);
    color:#ffffff;
    box-shadow:0 12px 24px -14px rgba(38,128,78,.55);
  }
  #start-screen{ padding:6px 4px 6px; }
  .hero, .result-card{
    background:rgba(255,255,255,.84);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:var(--shadow);
    backdrop-filter:blur(8px);
  }
  .hero h2{ color:#0d4e73; font-size:clamp(24px, 3vw, 34px); }
  .hero p{ color:#36576e; font-size:clamp(14px, 1.7vw, 16px); max-width:48em; margin:0 auto; }
  .legend{ flex-wrap:wrap; }
  .legend .item{
    background:rgba(255,255,255,.88);
    border:1px solid rgba(128,193,235,.55);
    width:min(140px, 42vw);
    box-shadow:0 12px 24px -20px rgba(18,83,124,.35);
  }
  .legend img{ box-shadow:0 8px 18px -14px rgba(0,0,0,.35); }
  .btn{
    border-radius:16px;
    font-size:clamp(16px, 1.8vw, 18px);
  }
  .btn-primary{
    background:linear-gradient(180deg, #7fd2ff, #4bb4f2);
    color:#063f66;
    box-shadow:0 16px 30px -16px rgba(36,133,191,.45);
  }
  .hud .pill{
    background:rgba(255,255,255,.84);
    border:1px solid rgba(142,200,234,.9);
    color:#29516d;
    box-shadow:0 8px 22px -20px rgba(21,88,128,.4);
    font-size:13px;
  }
  .hud .pill b{ color:#0f7fc0; }
  .sky{
    min-height:min(70vh, 620px);
    background:
      radial-gradient(circle at 18% 18%, rgba(255,255,255,.42) 0 6%, transparent 7%),
      radial-gradient(circle at 82% 28%, rgba(255,255,255,.30) 0 4%, transparent 5%),
      linear-gradient(180deg, #79cfff 0%, #a8e0ff 58%, #dff3ff 100%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 18px 40px -20px rgba(30,90,128,.3);
  }
  .sky::before,
  .sky::after{
    content:"";
    position:absolute;
    pointer-events:none;
    background-repeat:no-repeat;
    opacity:.95;
  }
  .sky::before{
    top:34px;
    left:18px;
    width:220px;
    height:90px;
    background:
      radial-gradient(circle at 16% 62%, #fff 0 18%, transparent 19%),
      radial-gradient(circle at 36% 44%, #fff 0 23%, transparent 24%),
      radial-gradient(circle at 58% 58%, #fff 0 18%, transparent 19%),
      radial-gradient(circle at 77% 48%, rgba(255,255,255,.98) 0 15%, transparent 16%);
    filter:drop-shadow(0 8px 16px rgba(255,255,255,.18));
  }
  .sky::after{
    top:84px;
    right:24px;
    width:180px;
    height:70px;
    background:
      radial-gradient(circle at 18% 62%, rgba(255,255,255,.88) 0 15%, transparent 16%),
      radial-gradient(circle at 46% 40%, #fff 0 20%, transparent 21%),
      radial-gradient(circle at 73% 58%, rgba(255,255,255,.9) 0 16%, transparent 17%);
  }
  .balloon{ filter:drop-shadow(0 14px 16px rgba(32,104,144,.18)); }
  .balloon .body{
    border:2px solid rgba(255,255,255,.5);
  }
  .balloon .string{ background:rgba(75,109,135,.45); }
  .burst{ font-size:30px; }
  .result-card .rank{ color:#1b8fcb; text-shadow:0 0 30px rgba(95,183,231,.25); }
  .result-card .rank-label{ color:#55748d; }
  .stat-row{ flex-wrap:wrap; justify-content:center; }
  .stat{
    min-width:110px;
    background:rgba(231,247,255,.92);
    border:1px solid rgba(170,218,244,.9);
  }
  .stat .v{ color:#14567d; }
  .stat .k{ color:#63829b; }
  @media (max-width: 767px){
    #app{ width:calc(100vw - 14px); padding:14px 7px 22px; }
    .topbar h1{ letter-spacing:.08em; }
    .hero{ padding:18px 14px 20px; }
    .sky{ min-height:62vh; }
    .balloon{ width:88px; }
    .balloon .body{ width:88px; height:106px; }
    .balloon .string{ height:34px; }
    .legend .item{ width:44%; min-width:120px; }
  }
  @media (min-width: 768px){
    #start-screen, #end-screen{ align-items:center; }
    .hero, .result-card{ width:min(760px, 100%); }
    .sky{ min-height:560px; }
  }

  .topbar h1::after{
    content:" ☁️🎈";
    letter-spacing:0;
    font-size:.9em;
  }
  .hero::after{
    content:"一起找出榕樹葉，變成小小觀察高手！";
    display:block;
    margin-top:12px;
    color:#4e7b98;
    font-size:clamp(13px,1.6vw,15px);
    font-weight:700;
  }
  .sky-ground{
    position:absolute;
    left:0; right:0; bottom:0;
    height:82px;
    background:linear-gradient(180deg, rgba(113,205,126,.15), rgba(93,190,110,.35) 35%, rgba(80,170,98,.72));
    border-top:2px solid rgba(255,255,255,.4);
    pointer-events:none;
  }
  .sky-ground::before{
    content:"";
    position:absolute;
    left:-2%; right:-2%; top:-12px; height:24px;
    background:
      radial-gradient(circle at 3% 100%, #76c969 0 18px, transparent 19px),
      radial-gradient(circle at 12% 100%, #7fd36f 0 16px, transparent 17px),
      radial-gradient(circle at 22% 100%, #6fc062 0 17px, transparent 18px),
      radial-gradient(circle at 33% 100%, #82d777 0 18px, transparent 19px),
      radial-gradient(circle at 45% 100%, #74c769 0 18px, transparent 19px),
      radial-gradient(circle at 58% 100%, #84d979 0 18px, transparent 19px),
      radial-gradient(circle at 69% 100%, #71c465 0 18px, transparent 19px),
      radial-gradient(circle at 81% 100%, #83d676 0 16px, transparent 17px),
      radial-gradient(circle at 92% 100%, #75c76b 0 18px, transparent 19px);
    opacity:.9;
  }
  .balloon .body::before{
    content:"";
    position:absolute;
    inset:10px auto auto 16px;
    width:16px; height:26px;
    border-radius:50%;
    background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0));
    transform:rotate(-18deg);
    opacity:.65;
  }
  .balloon.correct-pop .body{ box-shadow:0 0 0 8px rgba(255,255,255,.18), 0 0 24px rgba(255,232,120,.55); }
  .result-cheer{
    margin-top:16px;
    padding:12px 16px;
    border-radius:16px;
    background:linear-gradient(180deg,#fff7d7,#ffefba);
    color:#9a6a00;
    font-size:clamp(18px,2vw,24px);
    font-weight:900;
    letter-spacing:.08em;
    box-shadow:0 12px 28px -20px rgba(214,156,34,.55);
  }
  .result-sub{
    margin-top:8px;
    color:#5a7890;
    font-size:14px;
    font-weight:700;
  }
  .celebrate-layer{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:30;
  }
  .confetti{
    position:absolute;
    top:-20px;
    width:12px;
    height:18px;
    border-radius:3px;
    opacity:.95;
    animation:confettiFall linear forwards;
  }
  .confetti.ribbon{ width:6px; height:26px; border-radius:999px; }
  .firework-burst{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    box-shadow:0 0 0 0 rgba(255,255,255,.8);
    animation:fireworkPop 800ms ease-out forwards;
  }
  @keyframes confettiFall{
    0%{ transform:translateY(-30px) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(720deg); opacity:.95; }
  }
  @keyframes fireworkPop{
    0%{ transform:scale(.2); box-shadow:0 0 0 0 rgba(255,255,255,.9), 0 0 0 0 rgba(255,110,170,.95), 0 0 0 0 rgba(255,210,90,.95), 0 0 0 0 rgba(115,210,255,.95); opacity:1; }
    100%{ transform:scale(1.1); box-shadow:0 -48px 0 -4px rgba(255,255,255,0), 34px -34px 0 -4px rgba(255,110,170,0), 48px 0 0 -4px rgba(255,210,90,0), 34px 34px 0 -4px rgba(115,210,255,0), 0 48px 0 -4px rgba(122,225,132,0), -34px 34px 0 -4px rgba(255,160,88,0), -48px 0 0 -4px rgba(176,137,255,0), -34px -34px 0 -4px rgba(83,174,255,0); opacity:0; }
  }
  @media (max-width:767px){
    .result-cheer{font-size:20px;}
    .sky-ground{height:68px;}
  }
</style>

</head>
<body>


<div id="app">
  <div class="topbar">
    <h1 class="kai">榕&nbsp;葉&nbsp;氣&nbsp;球&nbsp;大&nbsp;作&nbsp;戰</h1>
    <div class="badge kai">榕</div>
  </div>

  <section id="start-screen">
    <div class="hero">
      <h2 class="kai">射準榕樹葉氣球！</h2>
      <p>氣球會不斷從下往上飄，限時 45 秒，點爆綠色的榕樹葉氣球得分，點到紅色的鳳凰木葉氣球會扣分，看你能拿多少分！</p>

  var audioCtx = null;
  function ensureAudio(){
    try{
      if(!audioCtx){ var AC = window.AudioContext || window.webkitAudioContext; audioCtx = new AC(); }
      if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    }catch(e){}
  }
  function tone(freq, start, dur, type, peak){
    if(!audioCtx) return;
    var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    var t0 = audioCtx.currentTime + start;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak || 0.18, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  function rand(min,max){ return Math.random() * (max-min) + min; }
  function celebrateConfetti(count){
    if(!el.celebrateLayer) return;
    for(var i=0;i<count;i++){
      var piece=document.createElement('div');
      piece.className='confetti' + (Math.random() < 0.35 ? ' ribbon' : '');
      piece.style.left = rand(0,100) + 'vw';
      piece.style.background = ['#ff6fa8','#ffd45a','#71d2ff','#7de08b','#b38cff','#ff9a57'][Math.floor(Math.random()*6)];
      piece.style.animationDuration = rand(2.4,4.8) + 's';
      piece.style.animationDelay = rand(0,0.8) + 's';
      piece.style.transform = 'rotate(' + rand(0,360) + 'deg)';
      el.celebrateLayer.appendChild(piece);
      setTimeout((function(node){ return function(){ if(node.parentNode) node.parentNode.removeChild(node); }; })(piece), 5600);
    }
  }
  function firework(x,y,count){
    if(!el.celebrateLayer) return;
    for(var i=0;i<count;i++){
      var b=document.createElement('div');
      b.className='firework-burst';
      b.style.left = 'calc(' + x + '% - 7px)';
      b.style.top = 'calc(' + y + '% - 7px)';
      b.style.animationDelay = (i*90) + 'ms';
      el.celebrateLayer.appendChild(b);
      setTimeout((function(node){ return function(){ if(node.parentNode) node.parentNode.removeChild(node); }; })(b), 1200 + i*90);
    }
  }

  function speak(text){
    if(!synth) return;
    try{ synth.cancel(); var u = new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=0.95; synth.speak(u); }catch(e){}
  }

  var BALLOON_COLORS = [
    { c1:'#fff6c2', c2:'#e8c25c' }, // 淡黃色
    { c1:'#cdeeff', c2:'#6fb8e0' }, // 淺藍色
    { c1:'#ffd9ea', c2:'#e08bb0' }  // 粉紅色
  ];

  function spawnBalloon(){
    var isBanyan = Math.random() < 0.45;
    var b = document.createElement('div');
    b.className = 'balloon';
    b.dataset.correct = isBanyan ? '1' : '0';

    var color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];
    b.style.setProperty('--c1', color.c1);
    b.style.setProperty('--c2', color.c2);

    var skyW = el.sky.clientWidth;
    var left = 10 + Math.random() * Math.max(10, (skyW - 124));
    b.style.left = left + 'px';

    var duration = 4.6 + Math.random() * 2.4;
    b.style.animationDuration = duration + 's';
    b.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');

    var body = document.createElement('div');
    body.className = 'body';
    var img = document.createElement('img');
    img.src = isBanyan ? BANYAN : PHOENIX;
    img.alt = isBanyan ? '榕樹葉' : '鳳凰木葉';
    body.appendChild(img);
    var string = document.createElement('div');
    string.className = 'string';

    b.appendChild(body);
    b.appendChild(string);

    b.addEventListener('click', function(){ popBalloon(b, isBanyan); });
    b.addEventListener('pointerdown', function(ev){ ev.preventDefault(); popBalloon(b, isBanyan); }, {passive:false});
    b.addEventListener('animationend', function(){
      if(b.parentNode) b.parentNode.removeChild(b);
    });

    el.sky.appendChild(b);
  }

  function burstEmoji(x, y, ok){
    var e = document.createElement('div');
    e.className = 'burst';
    e.textContent = ok ? ['✨','🎉','⭐'][Math.floor(Math.random()*3)] : '💥';
    e.style.left = (x - 13) + 'px';
    e.style.top = (y - 13) + 'px';
    el.sky.appendChild(e);
    setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); }, 520);
  }

  function popBalloon(b, isBanyan){
    if(!state.running || b.classList.contains('pop')) return;
    var rect = b.getBoundingClientRect();
    var skyRect = el.sky.getBoundingClientRect();
    burstEmoji(rect.left - skyRect.left + rect.width/2, rect.top - skyRect.top + rect.height/2, isBanyan);
    if(isBanyan){ b.classList.add('correct-pop'); }
    b.classList.add('pop');
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 200);

    if(isBanyan){
      state.hits++; state.score += 10;
      playPop();
    }else{
      state.wrong++; state.score = Math.max(0, state.score - 5);
      playBuzz();
      speak('這是鳳凰木的葉子');
    }
    el.hudScore.textContent = String(state.score);
  }

  function startGame(){
    ensureAudio();
    el.startScreen.hidden = true; el.endScreen.hidden = true; el.gameScreen.hidden = false;
    el.sky.innerHTML = '<div class="sky-ground"></div>';
    if(el.celebrateLayer) el.celebrateLayer.innerHTML = '';
    state.score = 0; state.hits = 0; state.wrong = 0; state.timeLeft = GAME_SECONDS; state.running = true;
    el.hudScore.textContent = '0';
    el.hudTime.textContent = String(GAME_SECONDS);

    speak('遊戲開始，快來找出榕樹葉氣球，加油');

    if(state.spawnTimer) clearInterval(state.spawnTimer);
    if(state.countdownTimer) clearInterval(state.countdownTimer);

    state.spawnTimer = setInterval(function(){
      if(state.running) spawnBalloon();
    }, 750);

    state.countdownTimer = setInterval(function(){
      state.timeLeft--;
      el.hudTime.textContent = String(Math.max(0, state.timeLeft));
      if(state.timeLeft <= 0){ endGame(); }
    }, 1000);
  }

  function endGame(){
    state.running = false;
    if(state.spawnTimer) clearInterval(state.spawnTimer);
    if(state.countdownTimer) clearInterval(state.countdownTimer);
    el.sky.innerHTML = '';

    var rank = 'C';
    if(state.score >= 140 && state.wrong <= 2) rank = 'S';
    else if(state.score >= 100) rank = 'A';
    else if(state.score >= 60) rank = 'B';

    el.finalRank.textContent = rank;
    el.finalScore.textContent = String(state.score);
    el.finalHits.textContent = String(state.hits);
    el.finalMiss.textContent = String(state.wrong);

    var cheerText = '你真棒！';
    var subText = '全部完成，太厲害了！';
    if(rank === 'S'){
      cheerText = '你真棒！';
      subText = '榕葉小達人就是你！';
    }else if(rank === 'A'){
      cheerText = '太棒了！';
      subText = '觀察力超厲害，差一點就 S 囉！';
    }else if(rank === 'B'){
      cheerText = '做得很好！';
      subText = '你已經找到好多榕樹葉了！';
    }else{
      cheerText = '再接再厲！';
      subText = '你有越玩越厲害喔！';
    }
    el.resultCheer.textContent = cheerText;
    el.resultSub.textContent = subText;

    playFanfare();
    bigCelebrate();
    speak('時間到，' + cheerText + '，你得到' + state.score + '分');

    setTimeout(function(){
      el.gameScreen.hidden = true; el.endScreen.hidden = false;
    }, 300);
  }

  el.startBtn.addEventListener('click', startGame);
  el.retryBtn.addEventListener('click', startGame);
})();
</script>

</body>
</html>
